<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>7y</title>
<link rel="icon" href="https://zh.minecraft.wiki/images/Invicon_End_Crystal.gif" type="image/gif">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: url("https://image2url.com/r2/default/files/1771746886279-7fa8b6e9-9501-4429-9881-390006a9294e.png") no-repeat center center fixed;
    background-size: cover;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow: hidden;
    animation: breathBg 8s ease-in-out infinite alternate;
  }

  @keyframes breathBg {
    0% { filter: brightness(1); }
    100% { filter: brightness(1.15); }
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.3);
    z-index: -1;
  }

  /* 飘雪修复版：只从屏幕外下落 */
  .snowflake {
    position: fixed;
    background: white;
    border-radius: 50%;
    opacity: 0.85;
    z-index: 1;
    pointer-events: none;
  }

  @keyframes snowfall {
    0% {
      transform: translate(0, -10px) rotate(0deg);
      opacity: 0;
    }
    5% {
      opacity: 1;
    }
    95% {
      opacity: 1;
    }
    100% {
      transform: translate(calc(var(--sway)*1px), 100vh) rotate(360deg);
      opacity: 0;
    }
  }

  /* 雪花大小控制 */
  .snow-control {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999;
    display: flex;
    gap: 8px;
  }

  .snow-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: rgba(255,255,255,0.85);
    color: #333;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
  }

  .snow-btn:hover {
    background: #fff;
  }

  .snow-btn.active {
    background: #0071e3;
    color: white;
  }

  /* 音乐播放器 */
  .music-player {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 420px;
    background: rgba(255,255,255,0.9);
    border-radius: 12px;
    padding: 12px 16px;
    z-index: 999;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .music-player h4 {
    font-size: 14px;
    margin-bottom: 8px;
    text-align: center;
    color: #333;
  }

  .music-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .file-input {
    flex: 1;
    font-size: 12px;
  }

  .play-btn {
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    background: #0071e3;
    color: white;
    cursor: pointer;
  }

  .progress {
    width: 100%;
    height: 6px;
    appearance: none;
    border-radius: 3px;
    background: #ddd;
    margin-bottom: 6px;
  }

  .progress::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #0071e3;
  }

  .volume {
    width: 80px;
  }

  /* 卡片浮动 */
  .container {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.92);
    padding: 40px 35px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    animation: floatCard 4s ease-in-out infinite alternate;
    position: relative;
    z-index: 2;
  }

  @keyframes floatCard {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-8px); }
  }

  .lang-switch {
    text-align: center;
    margin-bottom: 20px;
  }

  .lang-btn {
    padding: 6px 10px;
    margin: 0 4px;
    border: none;
    border-radius: 6px;
    background: #eee;
    cursor: pointer;
    transition: 0.2s;
  }

  .lang-btn.active {
    background: #0071e3;
    color: white;
  }

  .content {
    display: none;
    opacity: 0;
    transform: translateY(10px);
  }

  .content.active {
    display: block;
    animation: fadeIn 1s ease-out forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 26px;
    text-align: center;
    margin-bottom: 8px;
  }

  .nickname {
    font-size: 18px;
    color: #0071e3;
    font-weight: bold;
    text-align: center;
    margin-bottom: 18px;
  }

  .quote-box, .account-box {
    position: relative;
    padding: 16px;
    border-radius: 10px;
    margin: 12px 0;
    text-align: center;
    overflow: hidden;
  }

  .quote-box {
    background: #fdf2f8;
    border: 2px solid #a78bfa;
  }

  .account-box {
    background: #e8f4f8;
    border: 2px solid #3b82f6;
    font-family: monospace;
  }

  .quote-box::after, .account-box::after {
    content: '';
    position: absolute;
    top: -3px; left: -3px; right: -3px; bottom: -3px;
    background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
    background-size: 400% 400%;
    border-radius: 12px;
    z-index: -1;
    animation: borderGlow 4s linear infinite;
    filter: blur(4px);
  }

  .account-box::after {
    background: linear-gradient(45deg, #3b82f6, #06b6d4, #8b5cf6, #3b82f6);
  }

  @keyframes borderGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .box-title {
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .item {
    text-align: center;
    margin: 6px 0;
    font-size: 15px;
  }

  .link-btn {
    display: block;
    margin-top: 12px;
    padding: 12px;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
  }

  .link-btn::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: 0.5s;
  }

  .link-btn:hover::before {
    width: 300px;
    height: 300px;
  }

  .link-btn:hover {
    transform: scale(1.03);
  }

  .bilibili { background: #FB7299; }
  .namemc   { background: #4DDB9F; }
  .youtube  { background: #FF0000; }
  .discord  { background: #5865F2; }

  .visitor-count {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #666;
  }
</style>
</head>

<body>

<!-- 雪花大小控制 -->
<div class="snow-control">
  <button class="snow-btn active" onclick="setSnow('small')">小雪</button>
  <button class="snow-btn" onclick="setSnow('medium')">中雪</button>
  <button class="snow-btn" onclick="setSnow('big')">大雪</button>
</div>

<!-- 音乐播放器（支持本地上传） -->
<div class="music-player">
  <h4>🎵 本地音乐播放器</h4>
  <div class="music-controls">
    <input type="file" id="file" class="file-input" accept="audio/*">
    <button class="play-btn" onclick="togglePlay()">播放</button>
  </div>
  <input type="range" id="progress" class="progress" min="0" max="100" value="0">
  <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;">
    <span id="time">0:00</span>
    <input type="range" id="vol" class="volume" min="0" max="100" value="40">
  </div>
</div>

<div class="container">
  <div class="lang-switch">
    <button class="lang-btn" onclick="show('cn')">简体</button>
    <button class="lang-btn" onclick="show('tw')">繁體</button>
    <button class="lang-btn" onclick="show('en')">English</button>
  </div>

  <div class="content active" id="cn">
    <h1>个人主页</h1>
    <div class="nickname">7y</div>
    <div class="quote-box">
      <div class="box-title">今日名言</div>
      <div id="q_cn">加载中...</div>
    </div>
    <div class="account-box">
      <div class="box-title">今日 MC 账号</div>
      <div id="a_cn">获取中...</div>
    </div>
    <div class="item">喜欢编程、麦块</div>
    <div class="item">正在学习更多技术</div>
  </div>

  <div class="content" id="tw">
    <h1>個人主頁</h1>
    <div class="nickname">7y</div>
    <div class="quote-box">
      <div class="box-title">今日名言</div>
      <div id="q_tw">加載中...</div>
    </div>
    <div class="account-box">
      <div class="box-title">今日 MC 賬號</div>
      <div id="a_tw">獲取中...</div>
    </div>
    <div class="item">喜歡程式、麥塊</div>
    <div class="item">正在學習更多技術</div>
  </div>

  <div class="content" id="en">
    <h1>Profile</h1>
    <div class="nickname">7y</div>
    <div class="quote-box">
      <div class="box-title">Today's Quote</div>
      <div id="q_en">Loading...</div>
    </div>
    <div class="account-box">
      <div class="box-title">Today's MC Account</div>
      <div id="a_en">Fetching...</div>
    </div>
    <div class="item">I love coding & Minecraft</div>
    <div class="item">Learning new skills</div>
  </div>

  <a href="https://space.bilibili.com/1247576850" class="link-btn bilibili" target="_blank">Bilibili</a>
  <a href="https://zh-cn.namemc.com/profile/Xooo777yoooX.1" class="link-btn namemc" target="_blank">Namemc</a>
  <a href="https://www.youtube.com/channel/UCf2P1XYSConYpQ5TpDTB5NA" class="link-btn youtube" target="_blank">Youtube</a>
  <a href="https://discord.gg/BRZnvkqZKw" class="link-btn discord" target="_blank">Discord</a>

  <div class="visitor-count">
    本站访问量: <img src="https://profile-counter.glitch.me/wpkooo/count.svg" alt="访问量">
  </div>
</div>

<script>
  // ------------------------------
  // 雪花逻辑（已修复：只从顶部外下落）
  // ------------------------------
  let snowLevel = 'small';
  let snows = [];

  function clearSnows() {
    snows.forEach(s => s.remove());
    snows = [];
  }

  function setSnow(level) {
    snowLevel = level;
    document.querySelectorAll('.snow-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.snow-btn[onclick="setSnow('${level}')"]`).classList.add('active');
    clearSnows();
    makeSnow();
  }

  function makeSnow() {
    let count, sizeMin, sizeMax, speedMin, speedMax;
    if (snowLevel === 'small') {
      count = 40; sizeMin = 1; sizeMax = 2; speedMin = 12; speedMax = 20;
    } else if (snowLevel === 'medium') {
      count = 70; sizeMin = 2; sizeMax = 4; speedMin = 10; speedMax = 18;
    } else {
      count = 100; sizeMin = 3; sizeMax = 7; speedMin = 8; speedMax = 16;
    }

    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.classList.add('snowflake');

      const size = Math.random() * (sizeMax - sizeMin) + sizeMin;
      const left = Math.random() * 100;
      const sway = (Math.random() - 0.5) * 60;
      const dur = Math.random() * (speedMax - speedMin) + speedMin;
      const delay = Math.random() * dur;

      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = left + '%';
      s.style.setProperty('--sway', sway);
      s.style.animation = `snowfall ${dur}s linear infinite`;
      s.style.animationDelay = `-${delay}s`;

      document.body.appendChild(s);
      snows.push(s);
    }
  }

  // ------------------------------
  // 音乐播放器（支持本地上传）
  // ------------------------------
  const audio = new Audio();
  let playing = false;

  document.getElementById('file').addEventListener('change', e => {
    const url = URL.createObjectURL(e.target.files[0]);
    audio.src = url;
    audio.volume = 0.4;
  });

  function togglePlay() {
    if (!audio.src) return;
    if (playing) {
      audio.pause();
      playing = false;
      document.querySelector('.play-btn').textContent = '播放';
    } else {
      audio.play();
      playing = true;
      document.querySelector('.play-btn').textContent = '暂停';
    }
  }

  audio.addEventListener('timeupdate', () => {
    const p = (audio.currentTime / audio.duration) * 100 || 0;
    document.getElementById('progress').value = p;
    const m = Math.floor(audio.currentTime / 60);
    const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
    document.getElementById('time').textContent = `${m}:${s}`;
  });

  document.getElementById('progress').addEventListener('input', e => {
    if (!audio.duration) return;
    audio.currentTime = (e.target.value / 100) * audio.duration;
  });

  document.getElementById('vol').addEventListener('input', e => {
    audio.volume = e.target.value / 100;
  });

  audio.addEventListener('ended', () => {
    playing = false;
    document.querySelector('.play-btn').textContent = '播放';
  });

  // ------------------------------
  // 名言 & 账号
  // ------------------------------
  function show(lang) {
    document.querySelectorAll('.content').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.lang-btn').forEach(x => x.classList.remove('active'));
    document.getElementById(lang).classList.add('active');
    document.querySelectorAll('.lang-btn')[lang === 'cn' ? 0 : lang === 'tw' ? 1 : 2].classList.add('active');
  }

  function loadQuote() {
    fetch('https://v1.hitokoto.cn')
      .then(r => r.json())
      .then(d => {
        const t = `"${d.hitokoto}" —— ${d.from || '未知'}`;
        document.getElementById('q_cn').innerText = t;
        document.getElementById('q_tw').innerText = t;
        document.getElementById('q_en').innerText = d.hitokoto;
      });
  }

  function loadAccount() {
    const url = 'https://api.allorigins.win/get?url=' + encodeURIComponent('http://123.207.6.187/get.php?code=250722-136823478060658');
    fetch(url)
      .then(r => r.json())
      .then(d => {
        const txt = d.contents || '获取失败';
        document.getElementById('a_cn').innerText = txt;
        document.getElementById('a_tw').innerText = txt;
        document.getElementById('a_en').innerText = txt;
      });
  }

  // 启动
  document.addEventListener('DOMContentLoaded', () => {
    makeSnow();
    loadQuote();
    loadAccount();
  });
</script>
</body>
</html>
