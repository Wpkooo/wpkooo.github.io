<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>7y‘s Home</title>
<link rel="icon" href="https://zh.minecraft.wiki/images/Invicon_End_Crystal.gif" type="image/gif">

<!-- 加载所有需要的字体（MedievalSharp + Merriweather + Playfair Display） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* 字体切换核心样式：3种独立字体 */
  /* 1. 默认：MedievalSharp */
  body {
    font-family: 'MedievalSharp', serif;
    background: url("https://image2url.com/r2/default/files/1772158686793-115c34a0-2356-4ad7-934f-dad5b8081cbb.jpg") no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow: hidden;
    animation: breathBg 8s ease-in-out infinite alternate;
  }
  /* 2. Merriweather */
  body.font-merriweather {
    font-family: 'Merriweather', cursive;
  }
  /* 3. Playfair Display */
  body.font-playfair {
    font-family: 'Playfair Display', serif;
  }

  @keyframes breathBg {
    0% { filter: brightness(1); }
    100% { filter: brightness(1.15); }
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.3);
    z-index: -1;
  }

  /* 极光天幕 */
  .aurora {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 35vh;
    background: linear-gradient(90deg, #ff0084, #00ffff, #ff00ff, #00ff88);
    opacity: 0.15;
    filter: blur(60px);
    z-index: -1;
    animation: aurora 18s linear infinite;
  }
  @keyframes aurora {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* 雪花：顶端斜向密集 */
  .snowflake {
    position: fixed;
    background: white;
    border-radius: 50%;
    opacity: 0.85;
    z-index: 1;
    pointer-events: none;
    top: -10px;
  }
  @keyframes snowfall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { transform: translate(calc(var(--sway)*1px), 100vh) rotate(360deg); opacity: 0; }
  }

  /* 左上角控制区：雪花+字体按钮组合 */
  .top-left-controls {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 雪花按钮样式 */
  .snow-control {
    display: flex;
    gap: 8px;
  }
  .snow-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 0;
    background: rgba(255,255,255,0.85);
    color: #333;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 2px 2px 0 #ccc;
  }
  .snow-btn:hover { background: #fff; }
  .snow-btn.active { background: #0071e3; color: white; box-shadow: 2px 2px 0 #005cc8; }

  /* 字体切换按钮样式（左上角） */
  .font-switch {
    display: flex;
    gap: 6px;
    flex-wrap: wrap; /* 防止按钮超出屏幕 */
  }
  .font-btn {
    padding: 5px 10px;
    border: none;
    border-radius: 0;
    background: rgba(255,255,255,0.85);
    color: #333;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 2px 2px 0 #ccc;
    font-size: 12px;
    white-space: nowrap; /* 防止文字换行 */
  }
  .font-btn:hover { background: #fff; }
  .font-btn.active { background: #0071e3; color: white; box-shadow: 2px 2px 0 #005cc8; }

  /* 音乐播放器：左下角方正 */
  .music-player {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 320px;
    background: rgba(255,255,255,0.9);
    border-radius: 0;
    padding: 12px 16px;
    z-index: 999;
    box-shadow: 3px 3px 0 #ccc;
    border: 1px solid #ddd;
  }
  .music-player h4 { font-size: 14px; margin-bottom: 8px; text-align: center; color: #333; font-weight: 600; }
  .music-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .file-input { flex: 1; font-size: 12px; border-radius: 0; border: 1px solid #ddd; padding: 4px; }
  .play-btn { padding: 6px 10px; border: none; border-radius: 0; background: #0071e3; color: white; cursor: pointer; box-shadow: 2px 2px 0 #005cc8; }
  .progress { width: 100%; height: 6px; appearance: none; border-radius: 0; background: #ddd; margin-bottom: 6px; border: 1px solid #ccc; }
  .progress::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 0; background: #0071e3; border: 1px solid #005cc8; }
  .volume { width: 80px; border-radius: 0; }

  /* 卡片：文字炸裂 + 震动 + 银河旋转感 */
  .container {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.92);
    padding: 40px 35px;
    border-radius: 0;
    box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
    animation: floatCard 4s ease-in-out infinite alternate;
    position: relative;
    z-index: 2;
    border: 1px solid #eee;
  }
  @keyframes floatCard { 0% { transform: translateY(0px); } 100% { transform: translateY(-8px); } }

  /* 震动特效 */
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-2px, 2px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-2px, -2px); } }
  .shake { animation: shake 0.3s; }

  .lang-switch { text-align: center; margin-bottom: 15px; }
  .lang-btn { padding: 6px 10px; margin: 0 4px; border: none; border-radius: 0; background: #eee; cursor: pointer; transition: 0.2s; box-shadow: 2px 2px 0 #ddd; }
  .lang-btn.active { background: #0071e3; color: white; box-shadow: 2px 2px 0 #005cc8; }

  /* 文字炸裂 */
  .content { display: none; opacity: 0; transform: scale(0.8) translateY(30px); }
  .content.active { display: block; animation: explodeIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  @keyframes explodeIn {
    0% { opacity: 0; transform: scale(0.8) translateY(30px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  h1 { 
    font-size: 28px;
    text-align: center; 
    margin-bottom: 8px; 
    font-weight: 700;
  }
  .nickname { 
    font-size: 20px; 
    color: #0071e3; 
    font-weight: bold; 
    text-align: center; 
    margin-bottom: 18px; 
  }

  /* 寒冰+流光边框特效 */
  .quote-box, .account-box {
    position: relative;
    padding: 16px;
    border-radius: 0;
    margin: 12px 0;
    text-align: center;
    overflow: hidden;
    border: 2px solid #a78bfa;
    box-shadow: 3px 3px 0 #f0e6ff;
  }
  .quote-box { background: #fdf2f8; border: 2px solid #a78bfa; }
  .account-box { background: #e8f4f8; border: 2px solid #3b82f6; font-family: monospace; box-shadow: 3px 3px 0 #e0f2fe; }

  /* 寒冰流光 */
  .quote-box::after, .account-box::after {
    content: '';
    position: absolute;
    top: -3px; left: -3px; right: -3px; bottom: -3px;
    background: linear-gradient(45deg, #00ffff, #ffffff, #0088ff, #ffffff);
    background-size: 400% 400%;
    border-radius: 0;
    z-index: -1;
    animation: borderGlow 3s linear infinite;
    filter: blur(4px);
  }
  @keyframes borderGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  .box-title { font-size: 14px; color: #666; margin-bottom: 6px; font-weight: bold; }
  .item { text-align: center; margin: 6px 0; font-size: 16px; }

  .link-btn {
    display: block;
    margin-top: 12px;
    padding: 12px;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 0;
    font-weight: bold;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
    border: none;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }
  .link-btn::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: rgba(255,255,255,0.3);
    border-radius: 0;
    transform: translate(-50%, -50%);
    transition: 0.5s;
  }
  .link-btn:hover::before { width: 300px; height: 300px; }
  .link-btn:hover { transform: scale(1.03); }

  .bilibili { background: #FB7299; }
  .namemc   { background: #4DDB9F; }
  .youtube  { background: #FF0000; }
  .discord  { background: #5865F2; }

  .visitor-count { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }

  /* 彩蛋：末影龙特效（已修改，从卡片中心飞出） */
  .enderdragon {
    position: fixed;
    width: 200px;
    height: 150px;
    background: url('https://zh.minecraft.wiki/images/Ender_Dragon.gif') no-repeat center/contain;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    animation: dragonFly 8s linear forwards;
  }
  @keyframes dragonFly {
    0% { 
      opacity: 1;
      transform: translate(calc(50vw - 100px), calc(50vh - 75px)) scale(0.5) rotate(0deg);
    }
    25% { 
      transform: translate(calc(50vw - 100px), calc(20vh)) scale(1) rotate(0deg);
    }
    75% { 
      transform: translate(calc(100vw + 200px), calc(40vh)) scale(1.2) rotate(-10deg);
    }
    100% { 
      opacity: 0;
      transform: translate(calc(100vw + 300px), calc(50vh)) scale(1.5) rotate(-15deg);
    }
  }

  /* 彩蛋触发提示（隐藏） */
  .easter-egg-tip {
    position: fixed;
    bottom: 80px;
    left: 20px;
    background: rgba(0,0,0,0.8);
    color: #00ff00;
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 0;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
</style>
</head>

<body>
<div class="aurora"></div>
<div class="easter-egg-tip">双击卡片召唤末影龙🐉</div>

<!-- 左上角控制区：雪花按钮 + 字体按钮 -->

<script>
  // 雪花核心功能
  let snowLevel = 'small';
  let snows = [];
  function clearSnows() { 
    if (snows.length > 0) {
      snows.forEach(s => {
        try { s.remove(); } catch(e) {}
      }); 
      snows = []; 
    }
  }
  
  function setSnow(level) {
    snowLevel = level;
    document.querySelectorAll('.snow-btn').forEach(b => b.classList.remove('active'));
    const targetBtn = document.querySelector(`.snow-btn[onclick="setSnow('${level}')"]`);
    if (targetBtn) targetBtn.classList.add('active');
    clearSnows(); 
    makeSnow();
  }
  
  function makeSnow() {
    let count, sizeMin, sizeMax, speedMin, speedMax, swayRange;
    if (snowLevel === 'small') { count = 100; sizeMin = 1; sizeMax = 2; speedMin = 12; speedMax = 20; swayRange = 80; }
    else if (snowLevel === 'medium') { count = 180; sizeMin = 2; sizeMax = 4; speedMin = 10; speedMax = 18; swayRange = 120; }
    else { count = 250; sizeMin = 3; sizeMax = 7; speedMin = 8; speedMax = 16; swayRange = 150; }
    
    // 限制雪花数量，避免性能问题
    count = Math.min(count, 300);
    
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.classList.add('snowflake');
      const size = Math.random() * (sizeMax - sizeMin) + sizeMin;
      const left = Math.random() * 100;
      const sway = (Math.random() - 0.5) * swayRange;
      const dur = Math.random() * (speedMax - speedMin) + speedMin;
      const delay = Math.random() * dur;
      
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = left + '%';
      s.style.setProperty('--sway', sway);
      s.style.animation = `snowfall ${dur}s linear infinite`;
      s.style.animationDelay = `-${delay}s`;
      
      document.body.appendChild(s);
      snows.push(s);
    }
  }

  // 本地音乐播放器核心
  const audio = new Audio();
  let playing = false;
  
  document.getElementById('file').addEventListener('change', e => {
    if (!e.target.files || e.target.files.length === 0) return;
    // 释放之前的URL，避免内存泄漏
    if (audio.src) {
      try { URL.revokeObjectURL(audio.src); } catch(e) {}
    }
    const url = URL.createObjectURL(e.target.files[0]);
    audio.src = url; 
    audio.volume = 0.4;
    // 重置进度条
    document.getElementById('progress').value = 0;
    document.getElementById('time').textContent = '0:00';
  });
  
  function togglePlay() {
    if (!audio.src) {
      alert('请先选择音频文件！');
      return;
    }
    if (playing) { 
      audio.pause(); 
      playing = false; 
      document.querySelector('.play-btn').textContent = '播放'; 
    } else { 
      audio.play().catch(err => {
        alert('播放失败：' + err.message);
        playing = false;
        document.querySelector('.play-btn').textContent = '播放';
      }); 
      playing = true; 
      document.querySelector('.play-btn').textContent = '暂停'; 
    }
  }
  
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const p = (audio.currentTime / audio.duration) * 100 || 0;
    document.getElementById('progress').value = p;
    const m = Math.floor(audio.currentTime / 60);
    const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
    document.getElementById('time').textContent = `${m}:${s}`;
  });
  
  document.getElementById('progress').addEventListener('input', e => {
    if (!audio.duration) return;
    audio.currentTime = (e.target.value / 100) * audio.duration;
  });
  
  document.getElementById('vol').addEventListener('input', e => {
    audio.volume = e.target.value / 100;
  });
  
  audio.addEventListener('ended', () => {
    playing = false;
    document.querySelector('.play-btn').textContent = '播放';
    // 重置进度条
    document.getElementById('progress').value = 0;
    document.getElementById('time').textContent = '0:00';
  });
  
  // 音频播放错误处理
  audio.addEventListener('error', (e) => {
    alert('音频播放错误，请选择有效的音频文件！');
    playing = false;
    document.querySelector('.play-btn').textContent = '播放';
  });

  // 语言切换 + 震动特效
  function show(lang) {
    document.querySelectorAll('.content').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.lang-btn').forEach(x => x.classList.remove('active'));
    
    const contentEl = document.getElementById(lang);
    if (contentEl) contentEl.classList.add('active');
    
    const btnIndex = lang === 'cn' ? 0 : lang === 'tw' ? 1 : 2;
    const langBtns = document.querySelectorAll('.lang-btn');
    if (langBtns[btnIndex]) langBtns[btnIndex].classList.add('active');
    
    const container = document.querySelector('.container');
    if (container) {
      container.classList.add('shake');
      setTimeout(() => container.classList.remove('shake'), 300);
    }
  }

  // 字体切换核心功能（三种独立字体）
  function changeFont(fontType) {
    // 1. 移除所有字体类名
    document.body.classList.remove('font-merriweather', 'font-playfair');
    // 2. 移除所有字体按钮的active样式
    document.querySelectorAll('.font-btn').forEach(btn => btn.classList.remove('active'));
    
    // 3. 根据选择的字体添加对应类名
    if (fontType === 'merriweather') {
      document.body.classList.add('font-merriweather');
      document.querySelectorAll('.font-btn')[1].classList.add('active');
    } else if (fontType === 'playfair') {
      document.body.classList.add('font-playfair');
      document.querySelectorAll('.font-btn')[2].classList.add('active');
    } else {
      // 默认：MedievalSharp
      document.querySelectorAll('.font-btn')[0].classList.add('active');
    }
    
    // 4. 加震动特效
    const container = document.querySelector('.container');
    if (container) {
      container.classList.add('shake');
      setTimeout(() => container.classList.remove('shake'), 300);
    }
  }

  // 名言 & MC账号加载
  function loadQuote() {
    fetch('https://v1.hitokoto.cn')
      .then(r => {
        if (!r.ok) throw new Error('请求失败');
        return r.json();
      })
      .then(d => {
        const t = `"${d.hitokoto}" —— ${d.from || '未知'}`;
        document.getElementById('q_cn').innerText = t;
        document.getElementById('q_tw').innerText = t;
        document.getElementById('q_en').innerText = d.hitokoto;
      })
      .catch(err => {
        console.error('加载名言失败:', err);
        document.getElementById('q_cn').innerText = '人生没有白走的路，每一步都算数。—— 未知';
        document.getElementById('q_tw').innerText = '人生沒有白走的路，每一步都算數。—— 未知';
        document.getElementById('q_en').innerText = 'No road in life is in vain, every step counts.';
      });
  }
  
  function loadAccount() {
    const url = 'https://api.allorigins.win/get?url=' + encodeURIComponent('http://123.207.6.187/get.php?code=250722-136823478060658');
    fetch(url)
      .then(r => {
        if (!r.ok) throw new Error('请求失败');
        return r.json();
      })
      .then(d => {
        const txt = d.contents || '获取失败';
        document.getElementById('a_cn').innerText = txt;
        document.getElementById('a_tw').innerText = txt;
        document.getElementById('a_en').innerText = txt;
      })
      .catch(err => {
        console.error('加载MC账号失败:', err);
        const errorText = '暂时无法获取，请稍后再试';
        document.getElementById('a_cn').innerText = errorText;
        document.getElementById('a_tw').innerText = errorText;
        document.getElementById('a_en').innerText = 'Temporarily unavailable, please try again later';
      });
  }

  // 末影龙彩蛋
  let doubleClickTimer = null;
  let dragonCooldown = false; // 冷却机制，避免频繁触发
  
  document.getElementById('main-card').addEventListener('click', () => {
    // 显示提示
    const tipEl = document.querySelector('.easter-egg-tip');
    if (tipEl) {
      tipEl.style.opacity = 1;
      setTimeout(() => tipEl.style.opacity = 0, 3000);
    }
    
    // 双击检测
    if (doubleClickTimer) {
      clearTimeout(doubleClickTimer);
      doubleClickTimer = null;
      
      // 冷却检查
      if (dragonCooldown) return;
      dragonCooldown = true;
      setTimeout(() => dragonCooldown = false, 10000); // 10秒冷却
      
      // 创建末影龙
      const dragon = document.createElement('div');
      dragon.classList.add('enderdragon');
      document.body.appendChild(dragon);
      
      // 播放音效
      try {
        const roar = new Audio('https://assets.mojang.com/sounds/minecraft/sounds/mob/enderdragon/growl1.ogg');
        roar.volume = 0.5; 
        roar.play().catch(() => {}); // 静默失败，避免控制台报错
      } catch (e) {}
      
      // 移除末影龙元素
      setTimeout(() => {
        try { dragon.remove(); } catch(e) {}
      }, 8000);
    } else {
      doubleClickTimer = setTimeout(() => doubleClickTimer = null, 300);
    }
  });

  // 页面初始化
  document.addEventListener('DOMContentLoaded', () => {
    // 延迟初始化，提升页面加载体验
    setTimeout(() => {
      makeSnow();
      loadQuote();
      loadAccount();
    }, 500);
    
    // 窗口大小变化时重新生成雪花
    window.addEventListener('resize', () => {
      clearSnows();
      setTimeout(() => makeSnow(), 300);
    });
    
    // 清理资源
    window.addEventListener('beforeunload', () => {
      clearSnows();
      if (audio.src) {
        try { URL.revokeObjectURL(audio.src); } catch(e) {}
      }
    });
  });
</script>
