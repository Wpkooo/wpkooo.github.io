<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>7y 的主页</title>
<!-- MC末影水晶动态图标 -->
<link rel="icon" href="https://zh.minecraft.wiki/images/Invicon_End_Crystal.gif?2fae1" type="image/x-icon">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    /* 樱花林背景 */
    background: url("https://img2.imgtp.com/2025/02/22/4fIY4Q0V.jpeg") no-repeat center center fixed;
    background-size: cover;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    z-index: -1;
  }
  .container {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.9);
    padding: 40px 35px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }
  .lang-switch {
    text-align: center;
    margin-bottom: 20px;
  }
  .lang-btn {
    padding: 6px 10px;
    margin: 0 4px;
    border: none;
    border-radius: 6px;
    background: #eee;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lang-btn.active {
    background: #0071e3;
    color: white;
  }
  .lang-btn:hover {
    background: #ddd;
  }
  .content {
    display: none;
  }
  .content.active {
    display: block;
  }
  h1 {
    font-size: 26px;
    color: #222;
    margin-bottom: 10px;
    text-align: center;
  }
  .nickname {
    font-size: 18px;
    color: #0071e3;
    font-weight: bold;
    margin-bottom: 15px;
    text-align: center;
  }
  .quote-box {
    background: rgba(255, 255, 255, 0.8);
    padding: 15px;
    border-radius: 8px;
    margin: 20px 0;
    text-align: center;
    font-style: italic;
    color: #333;
    border: 1px solid #ddd;
  }
  .item {
    font-size: 16px;
    color: #333;
    line-height: 1.8;
    margin: 8px 0;
    text-align: center;
  }
  .link-btn {
    display: block;
    margin-top: 12px;
    padding: 12px;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: all 0.2s ease;
    border: 2px solid transparent;
  }
  .link-btn:hover {
    transform: scale(1.03);
    opacity: 0.95;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
  }
  .bilibili { background: #FB7299; }
  .namemc   { background: #4DDB9F; }
  .youtube  { background: #FF0000; }
  .discord  { background: #5865F2; }
  .visitor-count {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    color: #555;
  }
</style>
</head>

<body>
<div class="container">

  <div class="lang-switch">
    <button class="lang-btn" onclick="changeLang('cn')">简体</button>
    <button class="lang-btn" onclick="changeLang('tw')">繁體</button>
    <button class="lang-btn" onclick="changeLang('en')">English</button>
  </div>

  <!-- 简体 -->
  <div class="content active" id="cn">
    <h1>个人主页</h1>
    <div class="nickname">7y</div>
    
    <!-- 每日名言区域 -->
    <div class="quote-box" id="quote-content">
      加载中...
    </div>

    <div class="item">喜欢编程、麦块</div>
    <div class="item">正在学习更多技术</div>
  </div>

  <!-- 繁体 -->
  <div class="content" id="tw">
    <h1>個人主頁</h1>
    <div class="nickname">7y</div>
    <div class="quote-box" id="quote-content-tw">
      載入中...
    </div>
    <div class="item">喜歡程式、麥塊</div>
    <div class="item">正在學習更多技術</div>
  </div>

  <!-- English -->
  <div class="content" id="en">
    <h1>Profile</h1>
    <div class="nickname">7y</div>
    <div class="quote-box" id="quote-content-en">
      Loading...
    </div>
    <div class="item">I love coding & Minecraft</div>
    <div class="item">Learning new skills</div>
  </div>

  <!-- 平台链接 -->
  <a href="https://space.bilibili.com/1247576850?spm_id_from=333.337.search-card.all.click" class="link-btn bilibili" target="_blank">Bilibili</a>
  <a href="https://zh-cn.namemc.com/profile/Xooo777yoooX.1" class="link-btn namemc" target="_blank">Namemc</a>
  <a href="https://www.youtube.com/channel/UCf2P1XYSConYpQ5TpDTB5NA" class="link-btn youtube" target="_blank">Youtube</a>
  <a href="https://discord.gg/BRZnvkqZKw" class="link-btn discord" target="_blank">Discord</a>

  <!-- 访问量 -->
  <div class="visitor-count">
    本站访问量: <img src="https://profile-counter.glitch.me/wpkooo/count.svg" alt="访问量">
  </div>

</div>

<script>
  // 语言切换逻辑
  function changeLang(lang) {
    showLang(lang);
  }
  function showLang(lang) {
    document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.lang-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(lang).classList.add('active');
    document.querySelector(`.lang-btn:nth-child(${lang === 'cn' ? 1 : lang === 'tw' ? 2 : 3})`).classList.add('active');
  }

  // 每日名言逻辑：从公开API获取
  document.addEventListener('DOMContentLoaded', function() {
    fetch('https://api.quotable.io/random')
      .then(response => {
        if (!response.ok) throw new Error('网络错误');
        return response.json();
      })
      .then(data => {
        const quoteText = `"${data.content}" —— ${data.author}`;
        // 分别赋值给三个语言版本
        document.getElementById('quote-content').textContent = quoteText;
        document.getElementById('quote-content-tw').textContent = quoteText;
        document.getElementById('quote-content-en').textContent = "Today's Quote: " + quoteText;
      })
      .catch(err => {
        document.getElementById('quote-content').textContent = "今日名言加载失败";
        document.getElementById('quote-content-tw').textContent = "加載失敗";
        document.getElementById('quote-content-en').textContent = "Quote loading failed";
      });
  });
</script>

</body>
</html>
</html>
