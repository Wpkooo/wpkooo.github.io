<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>7y</title>
<link rel="icon" href="https://zh.minecraft.wiki/images/Invicon_End_Crystal.gif" type="image/gif">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .bg-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url("https://image2url.com/r2/default/files/1771746886279-7fa8b6e9-9501-4429-881390006a9294e.png") no-repeat center center fixed;
    background-size: cover;
    transition: background-image 1s;
    z-index: -2;
  }

  .bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.3);
    z-index: -1;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .aurora {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 35vh;
    background: linear-gradient(90deg, #ff0084, #00ffff, #ff00ff, #00ff88);
    opacity: 0.15;
    filter: blur(60px);
    z-index: 0;
    animation: aurora 18s linear infinite;
  }

  @keyframes aurora {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .snowflake {
    position: fixed;
    background: white;
    border-radius: 50%;
    opacity: 0.85;
    z-index: 1;
    pointer-events: none;
    top: -10px;
  }

  @keyframes snowfall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { transform: translate(calc(var(--sway)*1px), 100vh) rotate(360deg); opacity: 0; }
  }

  .snow-control {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999;
    display: flex;
    gap: 8px;
  }

  .snow-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 0;
    background: rgba(255,255,255,0.85);
    color: #333;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #ccc;
  }

  .snow-btn.active {
    background: #0071e3;
    color: white;
    box-shadow: 2px 2px 0 #005cc8;
  }

  .music-player {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 320px;
    background: rgba(255,255,255,0.9);
    border-radius: 0;
    padding: 12px 16px;
    z-index: 999;
    box-shadow: 3px 3px 0 #ccc;
    border: 1px solid #ddd;
  }

  .music-player h4 {
    font-size: 14px;
    margin-bottom: 8px;
    text-align: center;
  }

  .music-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .file-input {
    flex: 1;
    font-size: 12px;
    border-radius: 0;
    border: 1px solid #ddd;
    padding: 4px;
  }

  .play-btn {
    padding: 6px 10px;
    border: none;
    border-radius: 0;
    background: #0071e3;
    color: white;
    cursor: pointer;
    box-shadow: 2px 2px 0 #005cc8;
  }

  .progress {
    width: 100%;
    height: 6px;
    appearance: none;
    border-radius: 0;
    background: #ddd;
    margin-bottom: 6px;
    border: 1px solid #ccc;
  }

  .progress::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 0;
    background: #0071e3;
  }

  .volume {
    width: 80px;
    border-radius: 0;
  }

  .bg-music-btn {
    position: fixed;
    bottom: 110px;
    left: 20px;
    padding: 6px 10px;
    border: none;
    border-radius: 0;
    background: rgba(0,0,0,0.7);
    color: #0f0;
    cursor: pointer;
    z-index: 999;
    box-shadow: 2px 2px 0 #005cc8;
  }

  .digital-clock {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    color: #0f0;
    font-family: monospace;
    padding: 8px 12px;
    border-radius: 0;
    z-index: 999;
    font-size: 14px;
    border: 1px solid #0f0;
  }

  .container {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.92);
    padding: 40px 35px;
    border-radius: 0;
    box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
    position: relative;
    z-index: 2;
    border: 1px solid #eee;
    transition: filter 0.5s;
  }

  .blur-bg .container {
    filter: blur(4px);
  }

  @keyframes floatCard {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-8px); }
  }

  .shake {
    animation: shake 0.3s;
  }

  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-2px,2px); }
    50% { transform: translate(2px,-2px); }
    75% { transform: translate(-2px,-2px); }
  }

  .lang-switch {
    text-align: center;
    margin-bottom: 20px;
  }

  .lang-btn {
    padding: 6px 10px;
    margin: 0 4px;
    border: none;
    border-radius: 0;
    background: #eee;
    cursor: pointer;
    box-shadow: 2px 2px 0 #ddd;
  }

  .lang-btn.active {
    background: #0071e3;
    color: white;
    box-shadow: 2px 2px 0 #005cc8;
  }

  .content {
    display: none;
    opacity: 0;
    transform: scale(0.8) translateY(30px);
  }

  .content.active {
    display: block;
    animation: explodeIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes explodeIn {
    0% { opacity: 0; transform: scale(0.8) translateY(30px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  h1 {
    font-size: 26px;
    text-align: center;
    margin-bottom: 8px;
  }

  .nickname {
    font-size: 18px;
    color: #0071e3;
    font-weight: bold;
    text-align: center;
    margin-bottom: 18px;
  }

  .quote-box, .account-box {
    position: relative;
    padding: 16px;
    border-radius: 0;
    margin: 12px 0;
    text-align: center;
    overflow: hidden;
    border: 2px solid #a78bfa;
    box-shadow: 3px 3px 0 #f0e6ff;
  }

  .account-box {
    background: #e8f4f8;
    border-color: #3b82f6;
    box-shadow: 3px 3px 0 #e0f2fe;
  }

  .quote-box::after, .account-box::after {
    content: '';
    position: absolute;
    top: -3px; left: -3px; right: -3px; bottom: -3px;
    background: linear-gradient(45deg, #0ff, #fff, #08f, #fff);
    background-size: 400% 400%;
    border-radius: 0;
    z-index: -1;
    animation: borderGlow 3s linear infinite;
    filter: blur(4px);
  }

  @keyframes borderGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .box-title {
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .item {
    text-align: center;
    margin: 6px 0;
    font-size: 15px;
  }

  .link-btn {
    display: block;
    margin-top: 12px;
    padding: 12px;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 0;
    font-weight: bold;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
    border: none;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }

  .link-btn::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: rgba(255,255,255,0.3);
    border-radius: 0;
    transform: translate(-50%, -50%);
    transition: 0.5s;
  }

  .link-btn:hover::before {
    width: 300px;
    height: 300px;
  }

  .bilibili { background: #FB7299; }
  .namemc { background: #4DDB9F; }
  .youtube { background: #FF0000; }
  .discord { background: #5865F2; }

  .visitor-count {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #666;
  }

  .enderdragon {
    position: fixed;
    width: 200px;
    height: 150px;
    background: url('https://zh.minecraft.wiki/images/Ender_Dragon.gif') no-repeat center/contain;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    animation: dragonFly 8s linear forwards;
  }

  @keyframes dragonFly {
    0% { opacity:1; transform: translate(-200px,-100px) scale(0.5) rotate(10deg); }
    25% { transform: translate(50vw - 100px, 20vh) scale(1) rotate(0deg); }
    75% { transform: translate(100vw + 200px, 40vh) scale(1.2) rotate(-10deg); }
    100% { opacity:0; transform: translate(100vw + 300px, 50vh) scale(1.5) rotate(-15deg); }
  }

  .easter-egg-tip {
    position: fixed;
    bottom: 140px;
    left: 20px;
    background: rgba(0,0,0,0.8);
    color: #0f0;
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 0;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="bg-container"></div>
<div class="bg-overlay"></div>
<div class="aurora"></div>

<div class="easter-egg-tip">双击卡片召唤末影龙 🐉</div>

<div class="snow-control">
  <button class="snow-btn active" onclick="setSnow('small')">小雪</button>
  <button class="snow-btn" onclick="setSnow('medium')">中雪</button>
  <button class="snow-btn" onclick="setSnow('big')">大雪</button>
</div>

<button class="bg-music-btn" id="bgmusic" onclick="toggleBGM()">🎵 播放BGM</button>
<div class="digital-clock" id="clock"></div>

<div class="music-player">
  <h4>🎵 本地音乐播放器</h4>
  <div class="music-controls">
    <input type="file" id="file" class="file-input" accept="audio/*">
    <button class="play-btn" onclick="togglePlay()">播放</button>
  </div>
  <input type="range" id="progress" class="progress" min="0" max="100" value="0">
  <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;">
    <span id="time">0:00</span>
    <input type="range" id="vol" class="volume" min="0" max="100" value="40">
  </div>
</div>

<div class="container" id="card">
  <div class="lang-switch">
    <button class="lang-btn" onclick="show('cn')">简体</button>
    <button class="lang-btn" onclick="show('tw')">繁體</button>
    <button class="lang-btn" onclick="show('en')">English</button>
    <button class="lang-btn" onclick="cycleBG()">🔄 换背景</button>
  </div>

  <div class="content active" id="cn">
    <h1>个人主页</h1>
    <div class="nickname">7y</div>
    <div class="quote-box">
      <div class="box-title">今日名言</div>
      <div id="q_cn">加载中...</div>
    </div>
    <div class="account-box">
      <div class="box-title">今日 MC 账号</div>
      <div id="a_cn">获取中...</div>
    </div>
    <div class="item">喜欢编程、麦块</div>
    <div class="item">正在学习更多技术</div>
  </div>

  <div class="content" id="tw">
    <h1>個人主頁</h1>
    <div class="nickname">7y</div>
    <div class="quote-box">
      <div class="box-title">今日名言</div>
      <div id="q_tw">加載中...</div>
    </div>
    <div class="account-box">
      <div class="box-title">今日 MC 賬號</div>
      <div id="a_tw">獲取中...</div>
    </div>
    <div class="item">喜歡程式、麥塊</div>
    <div class="item">正在學習更多技術</div>
  </div>

  <div class="content" id="en">
    <h1>Profile</h1>
    <div class="nickname">7y</div>
    <div class="quote-box">
      <div class="box-title">Today's Quote</div>
      <div id="q_en">Loading...</div>
    </div>
    <div class="account-box">
      <div class="box-title">Today's MC Account</div>
      <div id="a_en">Fetching...</div>
    </div>
    <div class="item">I love coding & Minecraft</div>
    <div class="item">Learning new skills</div>
  </div>

  <a href="https://space.bilibili.com/1247576850" class="link-btn bilibili" target="_blank">Bilibili</a>
  <a href="https://zh-cn.namemc.com/profile/Xooo777yoooX.1" class="link-btn namemc" target="_blank">Namemc</a>
  <a href="https://www.youtube.com/channel/UCf2P1XYSConYpQ5TpDTB5NA" class="link-btn youtube" target="_blank">Youtube</a>
  <a href="https://discord.gg/BRZnvkqZKw" class="link-btn discord" target="_blank">Discord</a>

  <div class="visitor-count">
    本站访问量: <img src="https://profile-counter.glitch.me/wpkooo/count.svg" alt="访问">
  </div>
</div>

<script>
  // 雪花
  let snowMode = 'small';
  let snows = [];
  function clearSnows(){ snows.forEach(s=>s.remove()); snows=[]; }
  function setSnow(mode){
    snowMode = mode;
    document.querySelectorAll('.snow-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector(`.snow-btn[onclick="setSnow('${mode}')"]`).classList.add('active');
    clearSnows(); makeSnow();
  }
  function makeSnow(){
    let c,mi,ma,spmi,spma,sr;
    if(snowMode==='small'){c=100;mi=1;ma=2;spmi=12;spma=20;sr=80;}
    else if(snowMode==='medium'){c=180;mi=2;ma=4;spmi=10;spma=18;sr=120;}
    else{c=250;mi=3;ma=7;spmi=8;spma=16;sr=150;}
    for(let i=0;i<c;i++){
      const s=document.createElement('div');
      s.classList.add('snowflake');
      const sz=Math.random()*(ma-mi)+mi;
      const l=Math.random()*100;
      const sw=(Math.random()-0.5)*sr;
      const du=Math.random()*(spma-spmi)+spmi;
      const de=Math.random()*du;
      s.style.width=sz+'px';
      s.style.height=sz+'px';
      s.style.left=l+'%';
      s.style.setProperty('--sway',sw);
      s.style.animation=`snowfall ${du}s linear infinite`;
      s.style.animationDelay=`-${de}s`;
      document.body.appendChild(s);
      snows.push(s);
    }
  }

  // 背景切换
  const bgs=[
    "https://image2url.com/r2/default/files/1771746886279-7fa8b6e9-9501-4429-881390006a9294e.png",
    "https://image2url.com/r2/default/files/1771746886279-7fa8b6e9-9501-4429-881390006a9294e.png",
    "https://image2url.com/r2/default/files/1771746886279-7fa8b6e9-9501-4429-881390006a9294e.png"
  ];
  let bgidx=0;
  function cycleBG(){
    bgidx=(bgidx+1)%bgs.length;
    document.querySelector('.bg-container').style.backgroundImage=`url("${bgs[bgidx]}")`;
  }

  // 本地音乐
  const audio=new Audio();
  let playing=false;
  document.getElementById('file').addEventListener('change',e=>{
    const u=URL.createObjectURL(e.target.files[0]);
    audio.src=u; audio.volume=0.4;
  });
  function togglePlay(){
    if(!audio.src)return;
    if(playing){audio.pause();playing=false;document.querySelector('.play-btn').textContent='播放';}
    else{audio.play();playing=true;document.querySelector('.play-btn').textContent='暂停';}
  }
  audio.addEventListener('timeupdate',()=>{
    const p=(audio.currentTime/audio.duration)*100||0;
    document.getElementById('progress').value=p;
    const m=Math.floor(audio.currentTime/60);
    const s=Math.floor(audio.currentTime%60).toString().padStart(2,'0');
    document.getElementById('time').textContent=`${m}:${s}`;
  });
  document.getElementById('progress').addEventListener('input',e=>{
    if(!audio.duration)return;
    audio.currentTime=(e.target.value/100)*audio.duration;
  });
  document.getElementById('vol').addEventListener('input',e=>{
    audio.volume=e.target.value/100;
  });
  audio.addEventListener('ended',()=>{
    playing=false;
    document.querySelector('.play-btn').textContent='播放';
  });

  // BGM
  const bgm=new Audio('https://assets.mojang.com/sounds/music/game/creative/creative1.mp3');
  bgm.loop=true; bgm.volume=0.3;
  let bgmplay=false;
  function toggleBGM(){
    if(bgmplay){bgm.pause();bgmplay=false;document.getElementById('bgmusic').textContent='🎵 播放BGM';}
    else{bgm.play();bgmplay=true;document.getElementById('bgmusic').textContent='⏸ 暂停BGM';}
  }

  // 时钟
  function clock(){
    const d=new Date();
    const hh=d.getHours().toString().padStart(2,'0');
    const mm=d.getMinutes().toString().padStart(2,'0');
    const ss=d.getSeconds().toString().padStart(2,'0');
    document.getElementById('clock').textContent=`${hh}:${mm}:${ss}`;
  }
  setInterval(clock,1000);

  // 语言 + 震动
  function show(l){
    document.querySelectorAll('.content').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.lang-btn').forEach(x=>x.classList.remove('active'));
    document.getElementById(l).classList.add('active');
    const idx=l==='cn'?0:l==='tw'?1:2;
    document.querySelectorAll('.lang-btn')[idx].classList.add('active');
    document.getElementById('card').classList.add('shake');
    setTimeout(()=>document.getElementById('card').classList.remove('shake'),300);
  }

  // 点击模糊
  document.body.addEventListener('click',e=>{
    if(!e.target.closest('.container')){
      document.body.classList.toggle('blur-bg');
    }
  });

  // 彩蛋
  let dbltimer=null;
  document.getElementById('card').addEventListener('click',()=>{
    document.querySelector('.easter-egg-tip').style.opacity=1;
    setTimeout(()=>document.querySelector('.easter-egg-tip').style.opacity=0,3000);
    if(dbltimer){
      clearTimeout(dbltimer);
      dbltimer=null;
      summonDragon();
    }else{
      dbltimer=setTimeout(()=>dbltimer=null,300);
    }
  });
  function summonDragon(){
    const dr=document.createElement('div');
    dr.classList.add('enderdragon');
    document.body.appendChild(dr);
    const roar=new Audio('https://assets.mojang.com/sounds/mob/enderdragon/growl1.ogg');
    roar.volume=0.5; roar.play();
    setTimeout(()=>dr.remove(),8000);
  }

  // 名言 & 账号
  function loadQuote(){
    fetch('https://v1.hitokoto.cn').then(r=>r.json()).then(d=>{
      const t=`"${d.hitokoto}" —— ${d.from||'未知'}`;
      document.getElementById('q_cn').innerText=t;
      document.getElementById('q_tw').innerText=t;
      document.getElementById('q_en').innerText=d.hitokoto;
    });
  }
  function loadAccount(){
    const u='https://api.allorigins.win/get?url='+encodeURIComponent('http://123.207.6.187/get.php?code=250722-136823478060658');
    fetch(u).then(r=>r.json()).then(d=>{
      const t=d.contents||'获取失败';
      document.getElementById('a_cn').innerText=t;
      document.getElementById('a_tw').innerText=t;
      document.getElementById('a_en').innerText=t;
    });
  }

  document.addEventListener('DOMContentLoaded',()=>{
    makeSnow();
    loadQuote();
    loadAccount();
  });
</script>
</body>
</html>
